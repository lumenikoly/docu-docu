name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.0.2)
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc
      rc_number:
        description: RC number (used only for the rc channel)
        required: true
        default: '1'
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          install-only: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Validate release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must run from main, got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use X.Y.Z format, got $VERSION" >&2
            exit 1
          fi
          if [[ "$CHANNEL" != "stable" && "$CHANNEL" != "rc" ]]; then
            echo "Release channel must be stable or rc, got $CHANNEL" >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "rc" ]]; then
            if [[ ! "$RC_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "RC number must be a positive integer, got $RC_NUMBER" >&2
              exit 1
            fi
            release_version="$VERSION-rc.$RC_NUMBER"
          else
            release_version="$VERSION"
          fi

          actual_version="$(go run ./cmd/toudocu version)"
          if [[ "$actual_version" != "$VERSION" ]]; then
            echo "CLI version $actual_version does not match release version $VERSION" >&2
            exit 1
          fi

          heading_count="$(awk -v heading="## $VERSION" '$0 == heading { count++ } END { print count + 0 }' CHANGELOG.md)"
          if [[ "$heading_count" != "1" ]]; then
            echo "CHANGELOG.md must contain exactly one '## $VERSION' heading" >&2
            exit 1
          fi
          awk -v heading="## $VERSION" '
            $0 == heading { capture=1; next }
            /^## / && capture { exit }
            capture
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md section for $VERSION is empty" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$release_version" >/dev/null 2>&1; then
            echo "Tag $release_version already exists" >&2
            exit 1
          fi
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          awk -v heading="## $VERSION" '
            $0 == heading { capture=1; next }
            /^## / && capture { exit }
            capture
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          set -euo pipefail
          release_version="$VERSION"
          release_flags=()
          if [[ "$CHANNEL" == "rc" ]]; then
            release_version="$VERSION-rc.$RC_NUMBER"
            release_flags+=(--prerelease)
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$release_version" >/dev/null 2>&1; then
            echo "Tag $release_version already exists" >&2
            exit 1
          fi
          gh release create "$release_version" dist/* \
            --target "$GITHUB_SHA" \
            --title "$release_version" \
            --notes-file release-notes.md \
            "${release_flags[@]}" \
            --fail-on-no-commits
