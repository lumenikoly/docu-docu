name: deploy site to pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build documentation
        run: |
          go run ./cmd/toudocu build ./docs \
            --output "${RUNNER_TEMP}/toudocu-pages/project-docs" \
            --repository-root . \
            --clean \
            --strict \
            --stale-days 0
          go run ./cmd/toudocu build ./docs-en \
            --output "${RUNNER_TEMP}/toudocu-pages/project-docs/en" \
            --repository-root . \
            --clean \
            --strict \
            --stale-days 0
      - name: Add landing page
        run: |
          mkdir -p "${RUNNER_TEMP}/toudocu-pages/assets"
          cp landing/index.html landing/favicon.svg landing/styles.css landing/script.js \
            "${RUNNER_TEMP}/toudocu-pages/"
          cp -a landing/ru landing/en "${RUNNER_TEMP}/toudocu-pages/"
          cp -a landing/assets/. "${RUNNER_TEMP}/toudocu-pages/assets/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/toudocu-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
